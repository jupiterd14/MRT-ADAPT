<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRT-ADAPT | Alerts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: #00224D;
            --main-bg: #F8FAFC;
            --accent-blue: #3B82F6;
            --text-dark: #1E293B;
            --text-light: #64748B;
            --white: #FFFFFF;
            --border: #E2E8F0;
            --red: #EF4444;
            --orange: #F97316;
            --green: #10B981;
            --purple: #8B5CF6;
            --blue-bg: #EFF6FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; width: 100vw; background-color: var(--main-bg); overflow: hidden; }

        .sidebar { width: 300px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; flex-shrink: 0; padding: 20px 0; }
        .logo-section { padding: 10px 25px 20px; display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: #38BDF8; padding: 10px 13px; border-radius: 8px; font-size: 18px; }
        .logo-text h2 { font-size: 16px; margin: 0; }
        .logo-text p { font-size: 10px; opacity: 0.6; letter-spacing: 1px; }
        nav { padding: 40px 5px 5px 10px; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; color: #CBD5E1; text-decoration: none; font-size: 16px; position: relative; }
        .nav-item:hover, .nav-item.active { background-color: rgba(255, 255, 255, 0.1); color: rgb(148, 207, 255); border-left: 4px solid var(--accent-blue); }
        .nav-badge { position: absolute; right: 25px; background: var(--red); color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; display: none; }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 25px 40px; overflow-y: auto; }
        .greeting { font-size: 11px; color: var(--text-light); font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-top h1 { font-size: 24px; color: var(--text-dark); display: flex; align-items: center; gap: 12px; }
        .new-badge { background: var(--red); color: white; font-size: 10px; padding: 2px 8px; border-radius: 5px; text-transform: uppercase; font-weight: bold; }
        .mark-read-btn { background: #4F46E5; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .mark-read-btn:hover { background: #4338CA; transform: translateY(-1px); }
        .mark-read-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; background: white; border-radius: 16px; border: 1px solid var(--border); min-height: 400px; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid #E2E8F0; border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.5s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-screen p { color: var(--text-light); font-size: 13px; }

        .alert-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 18px 22px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; transition: 0.2s; position: relative; animation: fadeIn 0.15s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
        .alert-card.unread { border-left: 3px solid var(--accent-blue); background: #FBFCFE; }
        .unread-dot { position: absolute; top: 18px; right: 18px; width: 8px; height: 8px; background: var(--accent-blue); border-radius: 50%; }

        .alert-content { display: flex; gap: 14px; flex: 1; }
        .alert-icon { font-size: 16px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
        .alert-icon.red { color: var(--red); background: #FEE2E2; }
        .alert-icon.blue { color: var(--accent-blue); background: #EFF6FF; }
        .alert-icon.orange { color: var(--orange); background: #FFEDD5; }
        .alert-icon.purple { color: #8B5CF6; background: #EDE9FE; }

        .alert-text h3 { font-size: 14px; color: var(--text-dark); margin-bottom: 3px; font-weight: 600; }
        .alert-text p { font-size: 12px; color: var(--text-light); line-height: 1.4; margin-bottom: 5px; }
        .alert-time { font-size: 10px; color: var(--text-light); display: flex; align-items: center; gap: 5px; }

        .alert-actions { margin-left: 12px; }
        .alert-action-btn { background: none; border: none; color: var(--text-light); cursor: pointer; padding: 5px; border-radius: 5px; transition: 0.2s; font-size: 12px; }
        .alert-action-btn:hover { background: #F1F5F9; color: var(--accent-blue); }
        .alert-action-btn.marked { color: var(--green); }

        .header-icons { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: #F1F5F9; padding: 8px; border-radius: 8px; cursor: pointer; color: var(--text-dark); transition: 0.3s; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: #E2E8F0; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--text-dark); color: white; padding: 8px 16px; border-radius: 8px; font-size: 12px; z-index: 1000; animation: fadeIn 0.2s ease; }
        .toast.success { background: #10B981; }

        .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 1px dashed var(--border); }
        .empty-state i { font-size: 48px; color: var(--text-light); opacity: 0.5; margin-bottom: 15px; }
        .empty-state h3 { color: var(--text-dark); margin-bottom: 5px; font-size: 16px; }
        .empty-state p { color: var(--text-light); font-size: 13px; }

        #alertsContainer { display: none; }
        #alertsContainer.loaded { display: block; }
        .loading-screen { display: flex; }
        .loading-screen.hidden { display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-section">
            <div class="logo-icon"><i class="fas fa-subway"></i></div>
            <div class="logo-text"><h2>MRT-3</h2><p>CONGESTION TRACKER</p></div>
        </div>
        <nav>
            <a href="/user-dashboard" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="/live-map" class="nav-item"><i class="fas fa-map-marked-alt"></i> Live Map</a>
            <a href="/travel-plan" class="nav-item"><i class="fas fa-route"></i> Travel Status</a>
            <a href="/alerts" class="nav-item active"><i class="fas fa-exclamation-triangle"></i> Alerts <span class="nav-badge" id="sidebarAlertCount">0</span></a>
            <a href="/report" class="nav-item"><i class="fas fa-chart-line"></i> Report</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="greeting">GOOD {{ 'MORNING' if now.hour < 12 else 'AFTERNOON' if now.hour < 18 else 'EVENING' }}, {{ username.upper() }}</div>
        <div class="header-top">
            <h1>Alerts <span class="new-badge" id="newAlertBadge">0 New</span></h1>
            <div class="header-icons">
                <span class="icon-btn" onclick="refreshAlerts()"><i class="fas fa-sync-alt"></i></span>
                <button class="mark-read-btn" id="markAllBtn" onclick="markAllAsRead()"><i class="far fa-envelope-open"></i> Mark all as read</button>
            </div>
        </div>

        <div id="loadingScreen" class="loading-screen">
            <div class="loading-spinner"></div>
            <p>Loading alerts...</p>
        </div>
        <div id="alertsContainer"></div>
    </div>

    <script>
        let currentAlerts = [];
        let readAlerts = new Set();
        let isLoading = false;

        function loadReadStatus() { const saved = localStorage.getItem('readAlerts'); if (saved) readAlerts = new Set(JSON.parse(saved)); }
        function saveReadStatus() { localStorage.setItem('readAlerts', JSON.stringify([...readAlerts])); }

        function showLoading() {
            document.getElementById('loadingScreen').classList.remove('hidden');
            document.getElementById('alertsContainer').classList.remove('loaded');
        }
        function hideLoading() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('alertsContainer').classList.add('loaded');
        }

        // Generate alerts instantly from current time
        function getInstantAlerts() {
            const now = new Date();
            const hour = now.getHours();
            const minute = now.getMinutes();
            const alerts = [];
            
            // Rush hour alert
            if (hour >= 7 && hour <= 9) {
                alerts.push({
                    id: 'rush-morning',
                    type: 'rush',
                    icon: 'clock',
                    icon_color: 'orange',
                    title: '⚠️ MORNING RUSH HOUR',
                    message: `Rush hour in progress. Expect heavy congestion at North Ave, Cubao, and Ayala stations.`,
                    time: 'Just now',
                    unread: true
                });
            } else if (hour >= 17 && hour <= 19) {
                alerts.push({
                    id: 'rush-evening',
                    type: 'rush',
                    icon: 'clock',
                    icon_color: 'orange',
                    title: '⚠️ EVENING RUSH HOUR',
                    message: `Rush hour in progress. Heavy congestion at Ayala, Magallanes, and Taft stations.`,
                    time: 'Just now',
                    unread: true
                });
            }
            
            // Time-based advisory
            let timeMsg = '';
            if (hour < 7) timeMsg = 'Early morning service. Trains run every 8-10 minutes.';
            else if (hour >= 10 && hour <= 16) timeMsg = 'Midday operations. Comfortable travel conditions.';
            else if (hour >= 20 && hour <= 22) timeMsg = 'Last trains departing soon. Service ends at 10:30 PM.';
            else timeMsg = 'Regular operations. Next train arriving in 3-5 minutes.';
            
            alerts.push({
                id: 'time-status',
                type: 'advisory',
                icon: 'info-circle',
                icon_color: 'blue',
                title: '📅 CURRENT STATUS',
                message: timeMsg,
                time: 'Just now',
                unread: true
            });
            
            return alerts;
        }

        async function loadAlerts() {
            if (isLoading) return;
            isLoading = true;
            showLoading();
            
            // Show instant alerts immediately (no waiting!)
            currentAlerts = getInstantAlerts();
            displayAlerts(currentAlerts);
            updateAlertCounts(currentAlerts);
            hideLoading();
            
            // Then fetch real API data in background (don't block UI)
            try {
                const response = await fetch('/api/alerts/list');
                const apiAlerts = await response.json();
                if (apiAlerts && apiAlerts.length > 0) {
                    // Merge new alerts without duplicates
                    const existingIds = new Set(currentAlerts.map(a => a.id));
                    const newAlerts = apiAlerts.filter(a => !existingIds.has(a.id));
                    if (newAlerts.length > 0) {
                        currentAlerts = [...newAlerts, ...currentAlerts].slice(0, 15);
                        displayAlerts(currentAlerts);
                        updateAlertCounts(currentAlerts);
                    }
                }
            } catch (error) { /* Silent fail - keep local alerts */ }
            
            isLoading = false;
        }

        function displayAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            if (!alerts || alerts.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><h3>No new alerts</h3><p>All systems are running smoothly</p></div>`;
                return;
            }
            
            const unreadCount = alerts.filter(a => a.unread && !readAlerts.has(a.id)).length;
            document.getElementById('markAllBtn').disabled = unreadCount === 0;
            
            let html = '';
            alerts.forEach(alert => {
                const isRead = readAlerts.has(alert.id) || !alert.unread;
                const unreadClass = (!isRead && alert.unread) ? 'unread' : '';
                const unreadDot = (!isRead && alert.unread) ? '<div class="unread-dot"></div>' : '';
                html += `
                    <div class="alert-card ${unreadClass}" data-alert-id="${alert.id}">
                        <div class="alert-content">
                            <div class="alert-icon ${alert.icon_color}"><i class="fas fa-${alert.icon}"></i></div>
                            <div class="alert-text">
                                <h3>${alert.title}</h3>
                                <p>${alert.message}</p>
                                <div class="alert-time"><i class="far fa-clock"></i> ${alert.time}</div>
                            </div>
                        </div>
                        <div class="alert-actions">
                            <button class="alert-action-btn ${isRead ? 'marked' : ''}" onclick="markAsRead('${alert.id}')">
                                <i class="far ${isRead ? 'fa-check-circle' : 'fa-circle'}"></i>
                            </button>
                        </div>
                        ${unreadDot}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateAlertCounts(alerts) {
            const unreadCount = alerts.filter(a => a.unread && !readAlerts.has(a.id)).length;
            const badge = document.getElementById('newAlertBadge');
            badge.textContent = unreadCount > 0 ? unreadCount + ' New' : '0 New';
            badge.style.background = unreadCount > 0 ? 'var(--red)' : '#94A3B8';
            
            const sidebarBadge = document.getElementById('sidebarAlertCount');
            if (sidebarBadge) {
                if (unreadCount > 0) { sidebarBadge.textContent = unreadCount > 9 ? '9+' : unreadCount; sidebarBadge.style.display = 'block'; }
                else { sidebarBadge.style.display = 'none'; }
            }
        }

        function markAsRead(alertId) {
            readAlerts.add(alertId);
            saveReadStatus();
            const card = document.querySelector(`[data-alert-id="${alertId}"]`);
            if (card) {
                card.classList.remove('unread');
                const dot = card.querySelector('.unread-dot');
                if (dot) dot.remove();
                const btn = card.querySelector('.alert-action-btn');
                if (btn) { btn.classList.add('marked'); btn.innerHTML = '<i class="far fa-check-circle"></i>'; }
            }
            updateAlertCounts(currentAlerts);
            showToast('Marked as read');
        }

        function markAllAsRead() {
            const btn = document.getElementById('markAllBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Marking...';
            btn.disabled = true;
            currentAlerts.forEach(alert => { if (alert.unread) readAlerts.add(alert.id); });
            saveReadStatus();
            document.querySelectorAll('.alert-card.unread').forEach(card => {
                card.classList.remove('unread');
                const dot = card.querySelector('.unread-dot');
                if (dot) dot.remove();
                const btn = card.querySelector('.alert-action-btn');
                if (btn) { btn.classList.add('marked'); btn.innerHTML = '<i class="far fa-check-circle"></i>'; }
            });
            updateAlertCounts(currentAlerts);
            setTimeout(() => { btn.innerHTML = '<i class="far fa-envelope-open"></i> Mark all as read'; btn.disabled = false; }, 300);
            showToast('All alerts marked as read');
        }

        function refreshAlerts() { loadAlerts(); }
        function showToast(msg) { const toast = document.createElement('div'); toast.className = 'toast success'; toast.textContent = '✓ ' + msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 2000); }

        loadReadStatus();
        loadAlerts();
        setInterval(() => { if (!isLoading) loadAlerts(); }, 60000);
    </script>
</body>
</html>
