<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRT-3 | Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #00224D 0%, #1E3A8A 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 48px;
            color: #3B82F6;
            background: #EFF6FF;
            padding: 15px;
            border-radius: 50%;
        }

        .logo h2 {
            margin-top: 15px;
            color: #1E293B;
            font-size: 24px;
        }

        .logo p {
            color: #64748B;
            font-size: 14px;
            margin-top: 5px;
        }

        .error-message {
            background: #FEE2E2;
            color: #991B1B;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            border: 1px solid #FECACA;
        }

        .error-message i {
            color: #EF4444;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1E293B;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3B82F6;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #00224D;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: #1E3A8A;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,34,77,0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #64748B;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-link a:hover {
            color: #3B82F6;
        }

        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #F1F5F9;
            border-radius: 8px;
            font-size: 12px;
            color: #64748B;
            border: 1px dashed #CBD5E1;
        }

        .debug-info strong {
            color: #1E293B;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-user-shield"></i>
            <h2>Admin Login</h2>
            <p>MRT-3 Congestion Tracker</p>
        </div>

        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label><i class="far fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="admin@example.com" required autofocus>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Login as Admin
            </button>
        </form>

        <div class="back-link">
            <a href="/user-dashboard"><i class="fas fa-arrow-left"></i> Back to User Dashboard</a>
        </div>

        <!-- Debug info - shows if .env is configured -->
        <div class="debug-info">
            <strong>System Status:</strong><br>
            ADMIN_EMAIL configured: {{ '✅ Yes' if env_check.admin_email else '❌ No' }}<br>
            ADMIN_PASSWORD configured: {{ '✅ Yes' if env_check.admin_password else '❌ No' }}
        </div>
    </div>
</body>
</html>
